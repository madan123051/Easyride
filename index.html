<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>यात्री – Yatri | Nepal's #1 Ride & Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.0.8/index.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">
  <div id="pagesContainer"></div>
  <!-- SIDEBAR -->
  <div id="sidebar" class="fixed inset-0 z-50 pointer-events-none">
    <div id="sbOverlay" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity" onclick="toggleMenu()"></div>
    <div id="sbContent" class="absolute left-0 top-0 w-80 h-full bg-white transform -translate-x-full transition-transform duration-300 pointer-events-auto flex flex-col">
      <div class="grad px-6 pt-16 pb-8 text-white">
        <div class="flex items-center gap-4 mb-4">
          <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center text-xl font-bold border-2 border-white/30" id="sbAvatar">RP</div>
          <div>
            <p class="font-bold text-lg" id="sbName">Ram Prasad</p>
            <p class="text-sm opacity-80" id="sbRating">⭐ 4.7</p>
          </div>
        </div>
        <div class="flex gap-3">
          <div class="bg-white/20 rounded-lg px-3 py-2 text-center flex-1">
            <p class="text-xl font-bold" id="sbRides">42</p>
            <p class="text-xs opacity-80">Rides</p>
          </div>
          <div class="bg-white/20 rounded-lg px-3 py-2 text-center flex-1">
            <p class="text-xl font-bold" id="sbSaved">रू 850</p>
            <p class="text-xs opacity-80">Saved</p>
          </div>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto py-4 px-4 space-y-1">
        <a onclick="go('home');toggleMenu()" class="flex items-center gap-4 px-4 py-3 bg-red-50 rounded-xl text-red-600 font-medium cursor-pointer"><i class="fa-solid fa-house w-5"></i>Home</a>
        <a onclick="go('profile');toggleMenu()" class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 cursor-pointer"><i class="fa-solid fa-user w-5"></i>My Profile</a>
        <a onclick="go('branchSel');toggleMenu()" class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 cursor-pointer"><i class="fa-solid fa-building w-5"></i>Branches</a>
        <a onclick="go('rideHistory');toggleMenu()" class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 cursor-pointer"><i class="fa-solid fa-clock-rotate-left w-5"></i>Ride History</a>
        <a onclick="go('delivery');toggleMenu()" class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 cursor-pointer"><i class="fa-solid fa-box w-5"></i>Deliveries</a>
        <a onclick="go('wallet');toggleMenu()" class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 cursor-pointer"><i class="fa-solid fa-wallet w-5"></i>Payments</a>
        <a class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 cursor-pointer"><i class="fa-solid fa-tag w-5"></i>Promotions</a>
        <a class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 cursor-pointer"><i class="fa-solid fa-headset w-5"></i>Support</a>
        <a onclick="go('profileSettings');toggleMenu()" class="flex items-center gap-4 px-4 py-3 rounded-xl text-slate-700 hover:bg-slate-50 cursor-pointer"><i class="fa-solid fa-gear w-5"></i>Settings</a>
      </div>
      <div class="p-4 border-t">
        <a onclick="doLogout()" class="flex items-center gap-4 px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 font-medium cursor-pointer"><i class="fa-solid fa-right-from-bracket w-5"></i>Logout</a>
      </div>
    </div>
  </div>
  <!-- MODAL -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50">
    <div class="bg-white rounded-2xl p-8 mx-8 max-w-sm text-center anim-bounce">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-check text-2xl text-green-600"></i></div>
      <h3 class="text-lg font-bold mb-2" id="mTitle">Done!</h3>
      <p class="text-slate-500 text-sm mb-4" id="mMsg">Success</p>
      <button onclick="closeModal()" class="btn-primary py-3">OK</button>
    </div>
  </div>
  <!-- BOTTOM NAV -->
  <div id="bnav" class="absolute bottom-0 left-0 right-0 bg-white border-t px-6 py-2 hidden z-30">
    <div class="flex justify-around">
      <button onclick="navTab('home')" class="nt flex flex-col items-center gap-1 text-red-600" data-t="home"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] font-medium">Home</span></button>
      <button onclick="navTab('rides')" class="nt flex flex-col items-center gap-1 text-slate-400" data-t="rides"><i class="fa-solid fa-car text-lg"></i><span class="text-[10px] font-medium">Rides</span></button>
      <button onclick="navTab('del')" class="nt flex flex-col items-center gap-1 text-slate-400" data-t="del"><i class="fa-solid fa-box text-lg"></i><span class="text-[10px] font-medium">Delivery</span></button>
      <button onclick="navTab('food')" class="nt flex flex-col items-center gap-1 text-slate-400" data-t="food"><i class="fa-solid fa-utensils text-lg"></i><span class="text-[10px] font-medium">Food</span></button>
      <button onclick="navTab('acc')" class="nt flex flex-col items-center gap-1 text-slate-400" data-t="acc"><i class="fa-solid fa-user text-lg"></i><span class="text-[10px] font-medium">Account</span></button>
    </div>
    <div class="nav-ind"></div>
  </div>
</div>
<script src="pages/auth-pages.js"></script>
<script src="pages/main-pages.js"></script>
<script src="pages/branch-pages.js"></script>
<script src="pages/profile-pages.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
<script src="js/home.js"></script>
<script src="js/booking.js"></script>
<script src="js/delivery.js"></script>
<script src="js/branches.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
